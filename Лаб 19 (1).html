<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Cookies Auth</title>
<script>
// --- Функції з прикладу ---
function get_cookie(name) {
  var start = document.cookie.indexOf(name + "=");
  var len = start + name.length + 1;
  if ((!start) && (name != document.cookie.substring(0, name.length))) return null;
  if (start == -1) return null;
  var end = document.cookie.indexOf(";", len);
  if (end == -1) end = document.cookie.length;
  return unescape(document.cookie.substring(len, end));
}

function set_cookie(name, value) {
  var expires = new Date();
  expires.setTime(expires.getTime() + 7 * 24 * 60 * 60 * 1000);
  document.cookie = name + "=" + escape(value) +
                    "; expires=" + expires.toGMTString() +
                    "; path=/";
}

// --- Завдання ---
// 1) Запис авторизації у cookie
function saveAuth() {
  const user = document.getElementById("login").value;
  const pass = document.getElementById("pass").value;

  const authData = JSON.stringify({login: user, password: pass});
  set_cookie("auth", authData);

  console.log("Дані записано у cookie.");
}

// 2) Читання авторизації з cookie
function loadAuth() {
  const data = get_cookie("auth");
  console.log("Прочитано з cookie:", data);
}
</script>
</head>
<body>

<h2>Збереження авторизації у Cookie</h2>

Логін: <input type="text" id="login"><br><br>
Пароль: <input type="password" id="pass"><br><br>

<button onclick="saveAuth()">Записати у Cookie</button>
<button onclick="loadAuth()">Зчитати з Cookie</button>

</body>
</html>
