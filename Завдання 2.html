<html lang="en">
<head>
<meta charset="UTF-8">
<title>URL Validator</title>
<script>
let urlArray = [];

function validateAndAdd() {
  const input = document.getElementById('urlInput').value.trim();

  // Перевірка формату http://*.*.* або https://*.*.* 
  const regex = /^https?:\/\/([a-z0-9-]+\.){2,}[a-z]{2,}$/i;

  if (regex.test(input)) {
    urlArray.push(input);
    document.getElementById('urlList').textContent = 'URLs: ' + urlArray.join(', ');
    document.getElementById('urlInput').value = '';
  } else {
    alert('Invalid URL! Must be in format http://*.*.* or https://*.*.*');
  }
}
</script>
</head>
<body>
<h1>URL Validator</h1>
<input type="text" id="urlInput" placeholder="Enter URL">
<button onclick="validateAndAdd()">Add URL</button>
<p id="urlList">URLs: </p>
</body>
</html>
