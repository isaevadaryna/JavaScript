<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Country Areas</title>
<script>
let countries = {
  "France": 643801,
  "Germany": 357386,
  "Italy": 301340,
  "Spain": 505990,
  "Portugal": 92212,
  "Belgium": 30528,
  "Netherlands": 41543
};

function addCountry() {
  const name = prompt("Введіть назву країни:");
  const areaInput = prompt("Введіть площу країни (км²):");
  const area = parseFloat(areaInput);

  if (!name || isNaN(area)) {
    alert("Некоректні дані!");
    return;
  }

  countries[name] = area;
  alert("Країна додана!");
}

function showLargestCountry() {
  let maxArea = -Infinity;
  let maxCountry = "";
  for (const [country, area] of Object.entries(countries)) {
    if (area > maxArea) {
      maxArea = area;
      maxCountry = country;
    }
  }
  alert("Країна з найбільшою площею: " + maxCountry + " (" + maxArea + " км²)");
}

function showTotalArea() {
  let total = 0;
  for (const area of Object.values(countries)) {
    total += area;
  }
  alert("Сумарна площа всіх країн: " + total + " км²");
}
</script>
</head>
<body>
<h1>Площі європейських країн</h1>
<button onclick="addCountry()">Додати країну</button>
<button onclick="showLargestCountry()">Показати найбільшу країну</button>
<button onclick="showTotalArea()">Показати сумарну площу</button>
</body>
</html>
