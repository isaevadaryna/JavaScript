<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Math Sin and Cos</title>
<script>
function calculateAngles() {
  // Масив кутів опуклого п’ятикутника (в градусах)
  const angles = [72, 72, 72, 72, 72]; 

  let results = "Результати:<br>";

  for (let i = 0; i < angles.length; i++) {
    const radians = angles[i] * Math.PI / 180; // переведення в радіани
    if (i % 2 === 0) {
      results += `Кут ${i} (${angles[i]}°) → sin = ${Math.sin(radians).toFixed(3)}<br>`;
    } else {
      results += `Кут ${i} (${angles[i]}°) → cos = ${Math.cos(radians).toFixed(3)}<br>`;
    }
  }

  document.getElementById('angleResults').innerHTML = results;
}
</script>
</head>
<body>
<h1>Синуси та косинуси кутів</h1>
<button onclick="calculateAngles()">Обчислити</button>
<p id="angleResults"></p>
</body>
</html>
