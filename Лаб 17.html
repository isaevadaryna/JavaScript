<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Таймер з наведенням миші</title>
<style>
  body { font-family: Arial, sans-serif; margin: 40px; }
  .container {
    width: 300px;
    height: 150px;
    background-color: #f0f0f0;
    border: 2px solid #444;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  input {
    margin-top: 20px;
    padding: 8px;
    width: 100px;
    font-size: 16px;
    text-align: center;
  }
</style>
</head>
<body>

<h2>Таймер, який запускається при наведенні миші</h2>

<form id="timerForm">
  <div id="timerArea" class="container">
    Наведіть курсор, щоб запустити таймер
  </div>
  <br>
  <label>Час (секунди):</label>
  <input type="text" id="timeField" readonly>
</form>

<script>
  let timer = null;
  let seconds = 0;

  const timeField = document.getElementById('timeField');
  const timerArea = document.getElementById('timerArea');

  timerArea.addEventListener('mouseenter', function() {
    if (!timer) {
      timer = setInterval(() => {
        seconds++;
        timeField.value = seconds;
      }, 1000);
    }
  });

  timerArea.addEventListener('mouseleave', function() {
    clearInterval(timer);
    timer = null;
  });
</script>

</body>
</html>
