<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Date Greeting</title>
<script>
function greetByDate() {
  const today = new Date();
  const day = today.getDate(); // число місяця

  let greeting = (day % 2 === 0) ? "Добрий ранок" : "Добрий день";
  document.getElementById('greeting').textContent = greeting + "! Сьогодні " + day + "-е число місяця.";
}
</script>
</head>
<body>
<h1>Привітання за датою</h1>
<button onclick="greetByDate()">Отримати привітання</button>
<p id="greeting"></p>
</body>
</html>
